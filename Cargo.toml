[workspace]
resolver = "3"
members = ["limen-core", "limen-genai", "limen-gui", "limen-rig", "limen"]
default-members = ["limen-core", "limen-genai", "limen-rig", "limen"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3"
dirs = "7.0.0"
hound = "3.5.1"
libc = "0.2"
rust-i18n = "4.2.4"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "multipart",
  "json",
  "socks",
] }
# Pinned exactly: rig changes its API between minor releases, and only
# limen-rig names it.
rig-core = { version = "=0.46.0", default-features = false }
rig-reqwest = { version = "=0.46.0", default-features = false, features = [
  "rustls",
] }
# Pinned exactly for the same reason: only limen-genai names it.
genai = { version = "=0.7.3", default-features = false, features = [
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
limen-core = { path = "limen-core" }
limen-genai = { path = "limen-genai" }
limen-gui = { path = "limen-gui" }
limen-rig = { path = "limen-rig" }
gpui-kit = "=0.8.1"
zbus = { version = "6.1.0", default-features = false, features = [
  "proxy",
  "tokio",
] }
# macOS backends (limen-core, cfg(target_os = "macos") only).
cpal = "0.17"
enigo = { version = "0.6", default-features = false }
global-hotkey = "0.7"
core-foundation = "0.10"
crossbeam-channel = "0.5"
# Shared mic capture, published from its own repository; pinned to a commit
# for reproducible nix builds (the lock vendoring hashes it).
vessel-capture = { git = "https://github.com/vessel-audio/vessel-capture", rev = "9fc07ab2ed58ab6a0e5cbb9d81846ba0a881fc31" }
