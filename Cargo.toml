[workspace]
resolver = "3"
members = ["limen-core", "limen-gui", "limen-rig", "limen"]
default-members = ["limen-core", "limen-rig", "limen"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3"
dirs = "7.0.0"
hound = "3.5.1"
libc = "0.2"
rust-i18n = "4.2.4"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "multipart",
  "json",
] }
# Pinned exactly: rig changes its API between minor releases, and only
# limen-rig names it.
rig-core = { version = "=0.46.0", default-features = false }
rig-reqwest = { version = "=0.46.0", default-features = false, features = [
  "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
limen-core = { path = "limen-core" }
limen-gui = { path = "limen-gui" }
limen-rig = { path = "limen-rig" }
gpui-kit = "=0.8.1"
zbus = { version = "6.1.0", default-features = false, features = [
  "proxy",
  "tokio",
] }
