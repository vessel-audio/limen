[workspace]
resolver = "3"
members = ["voice-input-core", "voice-input-gui", "voice-input"]
default-members = ["voice-input-core", "voice-input"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3"
dirs = "7.0.0"
hound = "3.5.1"
libc = "0.2"
rust-i18n = "4.2.4"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "multipart",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
voice-input-core = { path = "voice-input-core" }
voice-input-gui = { path = "voice-input-gui" }
gpui-kit = "=0.8.1"
zbus = { version = "6.1.0", default-features = false, features = [
  "proxy",
  "tokio",
] }
