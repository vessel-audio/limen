[package]
name = "voice-input"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
dirs = "7.0.0"
futures = "0.3.34"
hound = "3.5.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6.1.0", default-features = false, features = ["proxy", "tokio"] }
