name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nix:
    name: Nix checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run flake checks
        run: nix flake check --print-build-logs
      - name: Run Clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings
      - name: Configure Fcitx addon
        run: |
          nix develop --command cmake \
            -S contrib/fcitx5-voice-input \
            -B "$RUNNER_TEMP/fcitx5-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVOICE_INPUT_DATA_HOME="$RUNNER_TEMP/fcitx5-install"
      - name: Build Fcitx addon
        run: nix develop --command cmake --build "$RUNNER_TEMP/fcitx5-build" --parallel
      - name: Check packaged executable
        run: nix run . -- --help
