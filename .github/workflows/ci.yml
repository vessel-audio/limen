name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    name: Headless Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run Clippy
        run: nix develop --command cargo clippy -p limen-core -p limen -p plugin-graph -p limen-vst-worker --all-targets -- -D warnings
      - name: Run tests
        run: nix develop --command cargo test -p limen-core -p limen -p plugin-graph -p limen-vst-worker
      # The tests above use fake plugins. These load a real one, in the real
      # worker, so they cover hosting: scanning, state, editor-less processing,
      # and a worker that dies mid-take. The plugin is open source and comes
      # from the binary cache, so CI needs no plugin of its own installed.
      - name: Fetch a free VST3 effect
        run: |
          plugins=$(nix build --inputs-from . nixpkgs#zam-plugins --no-link --print-out-paths)
          echo "TEST_VST3=$plugins/lib/vst3/ZamEQ2.vst3" >> "$GITHUB_ENV"
      - name: Build the plugin worker
        run: nix develop --command cargo build -p limen-vst-worker
      - name: Run tests against a real VST3 plugin
        run: |
          nix develop --command env \
            LIMEN_VST_WORKER="$PWD/target/debug/limen-vst-worker" \
            LIMEN_TEST_VST3="$TEST_VST3" \
            PLUGIN_GRAPH_TEST_WORKER="$PWD/target/debug/limen-vst-worker" \
            PLUGIN_GRAPH_TEST_VST3="$TEST_VST3" \
            cargo test -p limen-core -p plugin-graph -- --ignored
  gui:
    name: GUI Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --features limen/gui -- -D warnings
      - name: Run GUI tests
        run: nix develop --command cargo test -p limen-gui
  gui-e2e:
    name: GUI desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # `--all-targets` skips the suite because plain `cargo test` must.
      - name: Run Clippy on the E2E suite
        run: nix develop --command cargo clippy -p limen --features gui --test gui_e2e -- -D warnings
      - name: Run desktop E2E
        run: nix develop --command cargo gui-e2e
      - name: Upload screenshots, accessibility trees, and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-e2e
          path: target/tmp/gui-e2e
          if-no-files-found: ignore
  nix:
    name: Nix checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run flake checks
        run: nix flake check --print-build-logs
      - name: Configure Fcitx addon
        run: |
          nix develop --command cmake \
            -S contrib/fcitx5-limen \
            -B "$RUNNER_TEMP/fcitx5-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIMEN_DATA_HOME="$RUNNER_TEMP/fcitx5-install"
      - name: Build Fcitx addon
        run: nix develop --command cmake --build "$RUNNER_TEMP/fcitx5-build" --parallel
      - name: Check packaged executable
        run: nix run . -- --help
  macos:
    name: macOS Rust checks
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run headless Clippy
        run: nix develop --command cargo clippy -p limen-core -p limen -p plugin-graph -p limen-vst-worker --all-targets -- -D warnings
      - name: Run GUI Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --features limen/gui -- -D warnings
      - name: Run tests
        run: nix develop --command cargo test -p limen-core -p limen -p limen-gui -p plugin-graph -p limen-vst-worker
  macos-nix:
    name: macOS Nix package
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build packages
        run: nix build .#limen .#headless --print-build-logs
      # The package's install check already validates the bundle layout;
      # this checks what macOS itself will look at when the app launches.
      # Nix signs the executable ad hoc but cannot seal the bundle, so
      # `codesign --verify` would fail; arm64 only needs the binary signed.
      - name: Check app bundle
        run: |
          app=result/Applications/Limen.app
          plutil -lint "$app/Contents/Info.plist"
          codesign --display "$app/Contents/MacOS/limen"
          result/bin/limen --help
      # The UI is covered by the GUI tests; this covers what only the macOS
      # app does: host the daemon and stop it on the way out.
      - name: Smoke-test the app's daemon and quit
        run: |
          # A private home: the app writes its first-run config and binds its socket there.
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          limen="$PWD/result/Applications/Limen.app/Contents/MacOS/limen"
          socket="$HOME/Library/Caches/dev.limen.limen/run/limen.sock"
          log="$RUNNER_TEMP/limen-app.log"
          fail() {
            echo "::error::$1"
            cat "$log" "$HOME/Library/Caches/dev.limen.limen/daemon.log" 2>/dev/null || true
            exit 1
          }
          "$limen" >"$log" 2>&1 &
          pid=$!
          # The daemon inside the app answers once the window is up.
          for _ in $(seq 120); do
            "$limen" status >/dev/null 2>&1 && break
            kill -0 "$pid" 2>/dev/null || fail "Limen exited during startup"
            sleep 0.5
          done
          "$limen" status || fail "the in-app daemon never answered"
          # SIGTERM must quit like the menu's Quit: the daemon stops and unlinks
          # its socket, and the app exits 0 rather than dying of the signal.
          kill -TERM "$pid"
          # A quit that hangs is killed, failing with status 137.
          (sleep 30 && kill -KILL "$pid" 2>/dev/null) &
          watchdog=$!
          status=0
          wait "$pid" || status=$?
          kill "$watchdog" 2>/dev/null || true
          [ "$status" -eq 0 ] || fail "Limen exited with status $status after SIGTERM"
          [ ! -e "$socket" ] || fail "Limen left its socket behind"
          echo "Limen started its daemon and quit cleanly on SIGTERM"
