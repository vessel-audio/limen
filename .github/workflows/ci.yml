name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    name: Headless Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run Clippy
        run: nix develop --command cargo clippy -p limen-core -p limen --all-targets -- -D warnings
      - name: Run tests
        run: nix develop --command cargo test -p limen-core -p limen
  gui:
    name: GUI Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --features limen/gui -- -D warnings
      - name: Run GUI tests
        run: nix develop --command cargo test -p limen-gui
  gui-e2e:
    name: GUI desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # `--all-targets` skips the suite because plain `cargo test` must.
      - name: Run Clippy on the E2E suite
        run: nix develop --command cargo clippy -p limen --features gui --test gui_e2e -- -D warnings
      - name: Run desktop E2E
        run: nix develop --command cargo gui-e2e
      - name: Upload screenshots, accessibility trees, and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-e2e
          path: target/tmp/gui-e2e
          if-no-files-found: ignore
  nix:
    name: Nix checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run flake checks
        run: nix flake check --print-build-logs
      - name: Configure Fcitx addon
        run: |
          nix develop --command cmake \
            -S contrib/fcitx5-limen \
            -B "$RUNNER_TEMP/fcitx5-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIMEN_DATA_HOME="$RUNNER_TEMP/fcitx5-install"
      - name: Build Fcitx addon
        run: nix develop --command cmake --build "$RUNNER_TEMP/fcitx5-build" --parallel
      - name: Check packaged executable
        run: nix run . -- --help
