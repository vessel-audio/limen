<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The only fonts the desktop E2E suite lets the control panel see, so text
  sets the same on every machine. GPUI's Linux system UI font is IBM Plex
  Sans. Nix substitutes the store paths between the @ signs.
-->
<fontconfig>
  <dir>@ibmPlex@/share/fonts</dir>
  <dir>@dejavu@/share/fonts</dir>
  <dir>@wqyMicrohei@/share/fonts</dir>
</fontconfig>
